<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>苏丹的游戏</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="game-container">
    <div id="game-title">苏丹的游戏</div>
    <div id="story-box">
      <span class="cursor-blink"></span><!-- 光标闪烁效果 -->
    </div>
    <div id="hint-text">【 按任意键继续 】</div>
    <div id="battle-wrapper">
      <canvas id="battle-canvas"></canvas><!--- 战斗主界面 -->
      <div id="battle-count">被击中：<span id="hit-count">0</span>/<span id="hit-count-max">8</span></div>
      <div id="hp">
        <div id="hp-fill"></div>
      </div>
      <div id="direction-key-prompt">WASD 方向键/移动</div>
    </div>
  </div>
  <script src="script.js"></script>
</body>

</html>
